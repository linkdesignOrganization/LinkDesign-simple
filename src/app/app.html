<div
  class="shell"
  appTechnicalGridSurface
  [appTechnicalGridDisabled]="
    !isSoftware() &&
    !isSoftwareCr() &&
    !isSoftwareCrCase() &&
    !isContact() &&
    !isSystemDetail() &&
    !isIndustries() &&
    !isIndustryDetail()
  "
  [appTechnicalGridViewport]="true"
  [appTechnicalGridMode]="null"
  [appTechnicalGridCellSize]="
    isSoftware() ||
    isSoftwareCr() ||
    isSoftwareCrCase() ||
    isContact() ||
    isSystemDetail() ||
    isIndustries() ||
    isIndustryDetail()
      ? 18
      : null
  "
  [class.shell--plain]="isHome()"
  [class.shell--software]="isSoftware() || isSoftwareCr() || isSoftwareCrCase() || isSystemDetail()"
  [class.shell--contact]="isContact()"
>
  <header
    class="topbar"
    [class.topbar--home]="isHome()"
    [class.topbar--software]="isSoftware() || isSoftwareCr()"
    [class.topbar--back]="backOnly()"
  >
    @if (backOnly()) {
      <button class="topbar-back" type="button" (click)="goBack()" [attr.aria-label]="t().back">
        <svg lucideArrowLeft [size]="22" [strokeWidth]="1" aria-hidden="true"></svg>
      </button>
      <button
        type="button"
        class="lang-toggle"
        [class.is-en]="lang() === 'en'"
        role="switch"
        [attr.aria-checked]="lang() === 'en'"
        [attr.aria-label]="t().switchLang"
        (click)="toggleLang()"
      >
        <span class="lang-toggle__thumb" aria-hidden="true"></span>
        <span class="lang-toggle__opt" [class.is-active]="lang() === 'es'">ES</span>
        <span class="lang-toggle__opt" [class.is-active]="lang() === 'en'">EN</span>
      </button>
    } @else {
      <a class="brand" [routerLink]="localizeUrl('/')">Link Design</a>

      @if (!isHome() && !isNotFound()) {
        <nav class="nav" aria-label="Primary">
          @for (link of navLinks(); track link.href) {
            <a class="nav-link" [href]="localizeUrl(link.href)">{{ link.label[lang()] }}</a>
            <span class="nav-dot" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </span>
          }
          <button
            type="button"
            class="lang-toggle"
            [class.is-en]="lang() === 'en'"
            role="switch"
            [attr.aria-checked]="lang() === 'en'"
            [attr.aria-label]="t().switchLang"
            (click)="toggleLang()"
          >
            <span class="lang-toggle__thumb" aria-hidden="true"></span>
            <span class="lang-toggle__opt" [class.is-active]="lang() === 'es'">ES</span>
            <span class="lang-toggle__opt" [class.is-active]="lang() === 'en'">EN</span>
          </button>
        </nav>
      }

      <div class="topbar-actions">
        <!-- WhatsApp + contacto = par que se queda FIJO al hacer scroll (solo en internas).
             Desktop/tablet: juntos arriba a la derecha. Mobile: separados a las esquinas
             (WhatsApp a la izquierda, contacto a la derecha). En home/404 el par se disuelve
             y ambos botones flanquean el logo, sin fijarse. El WhatsApp es verde constante;
             el de contacto invierte con el fondo. -->
        <div class="cta-pair">
          <a
            class="wa-button"
            href="https://wa.me/50672325943"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="t().whatsapp"
            (click)="onWhatsapp()"
          >
            <app-whatsapp-icon [size]="24" />
          </a>

          @if (!isHome() && !isNotFound()) {
            <a class="button topbar-link" [routerLink]="localizeUrl('/contacto')">
              <span>{{ t().talk }}</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </a>
          }

          <a
            class="hs-button"
            [routerLink]="localizeUrl('/contacto')"
            [attr.aria-label]="t().talk"
          >
            <svg lucideHeadset [size]="22" [strokeWidth]="1" aria-hidden="true"></svg>
          </a>
        </div>

        @if (!isHome() && !isNotFound()) {
          <!-- Clon invisible: reserva el lugar del par fijo para que el resto del topbar no se recorra. -->
          <div class="cta-pair cta-pair--ghost" aria-hidden="true">
            <span class="wa-button"></span>
            <span class="button topbar-link">
              <span>{{ t().talk }}</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </span>
            <span class="hs-button"></span>
          </div>
        }
      </div>
    }
  </header>

  <main
    class="content"
    [class.content--software]="isSoftware() || isSoftwareCr() || isSoftwareCrCase() || isSystemDetail()"
  >
    <router-outlet />
  </main>
</div>
